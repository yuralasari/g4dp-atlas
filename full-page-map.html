<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this line, phones lay the page out at desktop width and the map looks tiny. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full page map | Project Website</title>
  <meta name="description" content="A description of your website">

  <!-- MapLibre's stylesheet. Keep it on the same major version (6) as the import map below. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/site.css">
  <!-- Tells the browser where "maplibre-gl" lives. The map needs it. -->
  <script type="importmap">
    { "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.mjs" } }
  </script>
  <!-- Defines <ml-map> and <ml-scrollytelling>. "@0.10" loads the newest 0.10.x release. -->
  <script type="module" src="https://unpkg.com/@maplibre-yaml/core@0.10/register.js"></script>
</head>
<!-- class="bleed": no page padding and no footer, for a page that is one big map. -->
<body class="bleed">
  <!-- The header is copied into every page. Changing a link? Change it in all four .html files. -->
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="./">Project Website</a>
      <nav class="site-nav">
        <a href="inline-maps.html">Inline maps</a>
        <a href="full-page-map.html" aria-current="page">Full page map</a>
        <a href="scrollytelling.html">Scrollytelling</a>
      </nav>
    </div>
  </header>

  <main>
    <!--
      The map is maps/full-page.yaml. class="full-page-map" (css/site.css)
      makes it fill the window below the header.
    -->
    <ml-map src="maps/full-page.yaml" class="full-page-map">
      <!-- A child with slot="top-left" (or top-right, bottom-left, bottom-right) sits in that corner of the map. -->
      <div slot="top-left" class="map-note">
        <strong>Central Park</strong><br>
        Squirrel sightings and Manhattan's bike lanes. Use the layer panel to
        switch layers on and off.
      </div>
    </ml-map>
  </main>
</body>
</html>
